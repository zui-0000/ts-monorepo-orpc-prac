packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  # 利用状況を送信するだけのパッケージ。動作に不要なので実行させない。
  "@scarf/scarf": false
  esbuild: true
  # ネイティブバイナリを postinstall で配置する (dependency-cruiser のパーサー)。
  "@swc/core": true
  # プラットフォーム別バイナリを postinstall で配置する。
  lefthook: true

# 依存バージョンの一元管理（各 package.json は "catalog:" で参照する）
catalog:
  "@commitlint/cli": ^21.2.2
  "@commitlint/config-conventional": ^21.2.2
  "@commitlint/types": ^21.2.0
  "@orpc/client": ^1.15.0
  "@orpc/contract": ^1.15.0
  "@orpc/openapi": ^1.15.0
  "@orpc/openapi-client": ^1.15.0
  "@orpc/server": ^1.15.0
  "@orpc/valibot": ^1.15.0
  "@swc/core": ^1.16.1
  "@types/bun": ^1.4.0
  # Node のランタイムに合わせる (mise.toml と engines が 24 系)。
  # LTS の系列を跨ぐときだけ上げる。check:updates は 26 系を報告するが追わない。
  "@types/node": ^24.13.3
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@vitejs/plugin-react": ^6.1.0
  better-result: ^3.0.1
  dependency-cruiser: ^18.2.0
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  hono: ^4.13.3
  lefthook: ^2.1.10
  react: ^19.2.8
  react-dom: ^19.2.8
  oxfmt: ^0.64.0
  oxlint: ^1.79.0
  oxlint-tsgolint: ^7.0.2001
  typescript: ^7.0.2
  valibot: ^1.4.2
  vite: ^8.2.2
