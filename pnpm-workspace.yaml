  '@commitlint/config-conventional': ^21.2.2
  '@commitlint/types': ^21.2.0
  '@orpc/contract': ^1.15.0
  '@orpc/openapi': ^1.15.0
  '@orpc/server': ^1.15.0
  '@types/bun': ^1.4.0
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  hono: ^4.13.3
  typescript: ^7.0.2
  valibot: ^1.4.2
