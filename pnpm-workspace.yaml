packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  # 利用状況を送信するだけのパッケージ。動作に不要なので実行させない。
  '@scarf/scarf': false
  esbuild: true
  # プラットフォーム別バイナリを postinstall で配置する。
  lefthook: true

# 依存バージョンの一元管理（各 package.json は "catalog:" で参照する）
catalog:
  '@commitlint/cli': ^21.2.2
  '@commitlint/config-conventional': ^21.2.2
  '@commitlint/types': ^21.2.0
  '@orpc/client': ^1.15.0
  '@orpc/contract': ^1.15.0
  '@orpc/openapi': ^1.15.0
  '@orpc/openapi-client': ^1.15.0
  '@orpc/server': ^1.15.0
  '@orpc/valibot': ^1.15.0
  '@stoplight/spectral-core': ^1.23.1
  '@stoplight/spectral-rulesets': ^1.22.7
  '@types/bun': ^1.4.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@types/swagger-ui-dist': ^3.30.6
  '@vitejs/plugin-react': ^6.1.0
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  hono: ^4.13.3
  lefthook: ^2.1.10
  react: ^19.2.8
  react-dom: ^19.2.8
  swagger-ui-dist: ^5.32.14
  typescript: ^7.0.2
  valibot: ^1.4.2
  vite: ^8.2.2
