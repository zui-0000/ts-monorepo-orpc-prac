# git hooks の設定。
#
# clone した人は pnpm install だけで有効になる (package.json の prepare が
# lefthook install を呼ぶ)。フックの登録先は .git/ 配下なので、
# 設定ファイルを共有するだけでは有効にならない点に注意。

commit-msg:
  commands:
    commitlint:
      # {1} は git が渡す第 1 引数 = コミットメッセージファイルのパス。
      run: ./node_modules/.bin/commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    contract-build:
      # 契約が変わったときだけ走らせる。lint / 整形 / 型検査を通し、
      # 契約が dist と OpenAPI 仕様まで組み上がることを確かめる。
      # build は毎回 dist を作り直す (消したファイルの成果物が残るため)。
      root: packages/contract/
      glob: "packages/contract/src/**/*.ts"
      run: pnpm build

    backend-check:
      # 型情報を使う lint (no-floating-promises 等) はここで走る。
      root: apps/backend/
      glob: "apps/backend/**/*.ts"
      run: pnpm check:lint && pnpm check:type

    frontend-check:
      root: apps/frontend/
      glob: "apps/frontend/**/*.{ts,tsx}"
      run: pnpm check:lint && pnpm check:type
